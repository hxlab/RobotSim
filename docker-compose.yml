services:
  robotsim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=${USER_UID}
        - USER_GID=${USER_GID}

    container_name: robotsim

    network_mode: host
    ipc: host
    privileged: true

    command: /bin/bash
    tty: true
    stdin_open: true

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
      ROS_LOCALHOST_ONLY: 1
      GTDD_HOME: /ros2_ws/src/3dsystems

    group_add:
      - dialout

    volumes:
      - ./:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./limits.conf:/etc/security/limits.conf
      - /dev:/dev
      - $XAUTHORITY:$XAUTHORITY
      - /run/udev:/run/udev

    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/serial:/dev/serial"
      - "/dev/ttyACM0:/dev/ttyACM0"

    cap_add:
      - SYS_NICE
      - SYS_PTRACE

    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400

    user: $UID:$UID