networks:
  ros_net:
    driver: bridge

services:

  # ============================================================
  # ROBOT SIDE
  # ============================================================
  robot:
    build:
      context: ./robot
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
        USERNAME: user

    container_name: robot
    networks:
      - ros_net
    privileged: true

    command: /bin/bash
    tty: true
    stdin_open: true

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      XAUTHORITY: /tmp/.docker.xauth

    volumes:
      - ./robot:/robot_ws
      - ./limits.conf:/etc/security/limits.conf

      # Only needed if using X11/Gazebo/RViz from the robot container
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.docker.xauth:/tmp/.docker.xauth:ro

      - /dev:/dev
      - /run/udev:/run/udev

      - ./fastdds_disable_shm.xml:/tmp/fastdds_disable_shm.xml:ro

    group_add:
      - dialout

    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/serial:/dev/serial"

    cap_add:
      - SYS_NICE
      - SYS_PTRACE

    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400


  # ============================================================
  # USER SIDE
  # GUI + HAPTIC DEVICE
  # ============================================================
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
        USERNAME: user

    container_name: user

    networks:
      - ros_net
    privileged: true

    command: /bin/bash
    tty: true
    stdin_open: true

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"

      # GUI
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /tmp/.docker.xauth

      # OpenHaptics
      GTDD_HOME: /user_ws/3dsystems

    group_add:
      - dialout

    volumes:
      - ./user:/user_ws

      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.docker.xauth:/tmp/.docker.xauth:ro

      # Realtime limits
      - ./limits.conf:/etc/security/limits.conf

      # USB / udev
      - /dev:/dev
      - /run/udev:/run/udev

      - ./fastdds_disable_shm.xml:/tmp/fastdds_disable_shm.xml:ro

    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/serial:/dev/serial"
      - "/dev/ttyACM0:/dev/ttyACM0"

    cap_add:
      - SYS_NICE
      - SYS_PTRACE

    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400


  # ============================================================
  # CONTACT-GRASPNET ROS2 WRAPPER
  # ============================================================
  contact_graspnet_ros2:
    build:
      context: ./contact_graspnet
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
        USERNAME: user

    user: root

    container_name: contact_graspnet_ros2

    networks:
      - ros_net
    privileged: true

    # Equivalent to:
    # podman run --rm \
    #   --device=nvidia.com/gpu=all \
    #   --security-opt=label=disable \
    #   ubuntu nvidia-smi -L
    devices:
      - nvidia.com/gpu=all

    security_opt:
      - label=disable

    command: /bin/bash
    tty: true
    stdin_open: true

    group_add:
      - dialout

    volumes:
      - ./contact_graspnet:/cgn_ros2_ws

      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # Realtime limits
      # - ./limits.conf:/etc/security/limits.conf
      - ./fastdds_disable_shm.xml:/tmp/fastdds_disable_shm.xml:ro

    cap_add:
      - SYS_NICE
      - SYS_PTRACE

    shm_size: 32gb

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /tmp/.docker.xauth
