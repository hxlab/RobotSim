services:

  # ============================================================
  # ROBOT SIDE
  # ============================================================
  robot:
    build:
      context: ./robot
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
        USERNAME: user

    container_name: robot

    network_mode: host
    ipc: host
    privileged: true

    command: /bin/bash
    tty: true
    stdin_open: true

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      XAUTHORITY: /tmp/.docker.xauth

    volumes:
      - ./robot:/robot_ws
      - ./limits.conf:/etc/security/limits.conf

      # Only needed if using X11/Gazebo/RViz from the robot container
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.docker.xauth:/tmp/.docker.xauth:ro

      - /dev:/dev
      - /run/udev:/run/udev

    group_add:
      - dialout

    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/serial:/dev/serial"

    cap_add:
      - SYS_NICE
      - SYS_PTRACE

    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400


  # ============================================================
  # USER SIDE
  # GUI + HAPTIC DEVICE
  # ============================================================
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
        USERNAME: user

    container_name: user

    network_mode: host
    ipc: host
    privileged: true

    command: /bin/bash
    tty: true
    stdin_open: true

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"

      # GUI
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /tmp/.docker.xauth

      # OpenHaptics
      GTDD_HOME: /user_ws/3dsystems

    group_add:
      - dialout

    volumes:
      - ./user:/user_ws

      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.docker.xauth:/tmp/.docker.xauth:ro

      # Realtime limits
      - ./limits.conf:/etc/security/limits.conf

      # USB / udev
      - /dev:/dev
      - /run/udev:/run/udev

    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/serial:/dev/serial"
      - "/dev/ttyACM0:/dev/ttyACM0"

    cap_add:
      - SYS_NICE
      - SYS_PTRACE

    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400


  # ============================================================
  # CONTACT-GRASPNET ROS2 WRAPPER
  # ============================================================
  contact_graspnet_ros2:
    build:
      context: ./contact_graspnet
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
        USERNAME: user

    user: root # this is a temporary change, hopefully

    container_name: contact_graspnet_ros2

    network_mode: host
    ipc: host
    privileged: true

    command: /bin/bash
    tty: true
    stdin_open: true

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"

    group_add:
      - dialout

    volumes:
      - ./contact_graspnet:/cgn_ros2_ws
      - /var/run/docker.sock:/var/run/docker.sock # this is a temporary change, hopefully

      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.docker.xauth:/tmp/.docker.xauth:ro

      # Realtime limits
      - ./limits.conf:/etc/security/limits.conf

    cap_add:
      - SYS_NICE
      - SYS_PTRACE

    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400

  contact_graspnet:
    build:
      context: ./contact_graspnet/contact_graspnet
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
        USERNAME: contact_graspnet

    container_name: contact_graspnet

    network_mode: host
    ipc: host

    shm_size: 32gb

    command: >
      bash -lc "
        conda run -n contact-graspnet bash compile_pointnet_tfops.sh &&
        exec bash -l
      "
    tty: true
    stdin_open: true

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics

    volumes:
      - ./contact_graspnet/contact_graspnet:/cgn_ws

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
